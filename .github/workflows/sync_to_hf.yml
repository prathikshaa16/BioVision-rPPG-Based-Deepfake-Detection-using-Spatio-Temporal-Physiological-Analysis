name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - p-v16-development
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Notice: HF_TOKEN secret is not set yet in GitHub Settings -> Secrets -> Actions."
            echo "Add your Hugging Face Access Token as secret 'HF_TOKEN' to enable automatic deployment."
            exit 0
          fi
          
          # Default to repository owner username if HF_USERNAME secret is not explicitly set
          HF_USER="${{ secrets.HF_USERNAME }}"
          if [ -z "$HF_USER" ]; then
            HF_USER="${{ github.repository_owner }}"
          fi
          
          SPACE_NAME="${{ secrets.HF_SPACE_NAME }}"
          if [ -z "$SPACE_NAME" ]; then
            SPACE_NAME="biovision-deepfake-detector"
          fi
          
          echo "Syncing repository to Hugging Face Space: $HF_USER/$SPACE_NAME"
          git push --force https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$SPACE_NAME HEAD:main
