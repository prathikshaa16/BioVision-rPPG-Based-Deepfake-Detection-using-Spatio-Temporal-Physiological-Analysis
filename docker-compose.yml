services:
  biovision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biovision-app
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
